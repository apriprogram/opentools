---
# Deploy otomatis dari cPanel Git Version Control ke opentools.garudanexa.com.
# Frontend sudah di-build dan tersimpan di frontend/dist (di-commit).
# Setelah deploy, Node.js App di-restart lewat tmp/restart.txt.
#
# PENTING: deploy ini sengaja TIDAK menyalin .htaccess ke folder situs.
# cPanel (Setup Node.js App) menyimpan sambungan ke aplikasi Node dan variabel lingkungannya
# di dalam .htaccess folder situs. Kalau file itu tertimpa, semua /api membalas 404 sampai
# aplikasi di-STOP lalu di-START lagi. Karena itu frontend/dist tidak boleh berisi .htaccess.
# Templat aturannya ada di deploy/htaccess, dipasang manual hanya saat menyiapkan server baru.
deployment:
  tasks:
    - export DEPLOYPATH=/home/garudanexa/opentools.garudanexa.com
    - /bin/mkdir -p $DEPLOYPATH/backend
    - /bin/cp -R frontend/dist/. $DEPLOYPATH/
    - /bin/cp -R backend/src $DEPLOYPATH/backend/
    - /bin/cp -R backend/scripts $DEPLOYPATH/backend/
    - /bin/cp backend/package.json backend/package-lock.json backend/start.cjs backend/.env.example $DEPLOYPATH/backend/
    - /bin/mkdir -p $DEPLOYPATH/backend/tmp
    - /bin/touch $DEPLOYPATH/backend/tmp/restart.txt
    - /bin/echo "Deployed to $DEPLOYPATH"
